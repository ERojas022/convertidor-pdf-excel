<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lector de Formatos D100 / MIDIS</title>
  <!-- Librería PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1150px;
      margin: 30px auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    h1 {
      color: #0056b3;
      text-align: center;
      margin-bottom: 5px;
    }
    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }
    .upload-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 25px;
    }
    input[type="file"] {
      padding: 10px;
      border: 1px dashed #0056b3;
      border-radius: 4px;
      background: #f8fafd;
      cursor: pointer;
    }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 25px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      border-left: 6px solid #0056b3;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }
    .badge {
      background: #e1f0ff;
      color: #0056b3;
      padding: 5px 10px;
      border-radius: 4px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 13px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px 10px;
      text-align: left;
    }
    th {
      background-color: #0056b3;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    .btn-export {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-export:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>

  <h1>Extractor de Registros - D100</h1>
  <p class="subtitle">Procesamiento local de PDFs de Solicitudes CSE (S100 / FSU)</p>

  <div class="upload-box">
    <p>Selecciona tus archivos PDF (puedes elegir varios a la vez):</p>
    <input type="file" id="fileInput" accept="application/pdf" multiple />
  </div>

  <div id="results"></div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    document.getElementById('fileInput').addEventListener('change', async function(e) {
      const files = e.target.files;
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      for (const file of files) {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          
          let pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + ' \n ';
        }

        const extractedData = parsePDF(fullText, file.name);
        renderTable(extractedData);
      }
    });

    function parsePDF(text, fileName) {
      // 1. Extraer Formato D100 N°
      const d100Match = text.match(/Número de Formato D100\s*:\s*(\d+)/i) || 
                        text.match(/FORMATO D100 Nro\.\s*:\s*(\d+)/i);
      const d100Number = d100Match ? d100Match[1] : 'No identificado';

      // 2. Limpiar texto previo a la tabla
      let cleanedText = text;
      const inicioTabla = text.search(/ANEXO DEL FORMATO D100|RELACIÓN DE FORMATOS/i);
      if (inicioTabla !== -1) {
        cleanedText = text.substring(inicioTabla);
      }

      // 3. Dividir por marcas de inicio de registro (FSU o S100)
      const textWithMarkers = cleanedText.replace(/\b(FSU|S100)\b(?=\s+\d{7,8})/g, '|||$1');
      const blocks = textWithMarkers.split('|||').filter(b => b.trim().startsWith('FSU') || b.trim().startsWith('S100'));

      const records = [];

      blocks.forEach(block => {
        const singleLineBlock = block.replace(/\s+/g, ' ').trim();

        // Estructura: [TIPO] [COD_OPERACION] [NUM_FORMATO] [FECHA] [DNI]-[NOMBRES]
        const regexBlock = /^(FSU|S100)\s+(\d+)\s+(\d+)\s+(\d{2}-\d{2}-\d{4})\s+([0-9A-Z]+)\s*-\s*(.+)$/i;
        const match = singleLineBlock.match(regexBlock);

        if (match) {
          let tipo = match[1].toUpperCase();
          let codOperacion = match[2];
          let numFormato = match[3];
          let fecha = match[4];
          let dni = match[5];
          let nombresRaw = match[6];

          let nombres = nombresRaw.split(/(Sub Total|Total|Pagina|Ubigeo|RELACIÓN DE FORMATOS)/i)[0].trim();

          records.push({
            d100: d100Number,
            tipo: tipo,
            codOperacion: codOperacion,
            numFormato: numFormato,
            fecha: fecha,
            dni: dni,
            nombres: nombres
          });
        }
      });

      return { fileName, d100Number, records };
    }

    function renderTable(data) {
      const resultsDiv = document.getElementById('results');
      const card = document.createElement('div');
      card.className = 'card';

      let html = `
        <div class="card-header">
          <div>
            <h2>📄 ${data.fileName}</h2>
            <span>Formato D100 N°: <strong class="badge">${data.d100Number}</strong></span> | 
            <span>Total registros extraídos: <strong>${data.records.length}</strong></span>
          </div>
          ${data.records.length > 0 ? `<button class="btn-export" onclick="exportCSV('${data.fileName}')">Exportar a Excel</button>` : ''}
        </div>
      `;

      if (data.records.length > 0) {
        html += `
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Formato D100 N°</th>
                <th>Tipo</th>
                <th>Cód. Operación</th>
                <th>Número de Formato</th>
                <th>Fecha de Solicitud/FSU</th>
                <th>DNI</th>
                <th>Apellidos y Nombres</th>
              </tr>
            </thead>
            <tbody>
              ${data.records.map((r, index) => `
                <tr>
                  <td>${index + 1}</td>
                  <td>${r.d100}</td>
                  <td>${r.tipo}</td>
                  <td>${r.codOperacion}</td>
                  <td>${r.numFormato}</td>
                  <td>${r.fecha}</td>
                  <td>${r.dni}</td>
                  <td>${r.nombres}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      } else {
        html += `<p><em>No se encontraron registros en este documento.</em></p>`;
      }

      card.innerHTML = html;
      card.dataset.records = JSON.stringify(data.records);
      resultsDiv.appendChild(card);
    }

    function exportCSV(fileName) {
      const cards = Array.from(document.querySelectorAll('.card'));
      const targetCard = cards.find(c => c.querySelector('h2').innerText.includes(fileName));
      if (!targetCard) return;

      const records = JSON.parse(targetCard.dataset.records);
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
      csvContent += "Item;Formato D100 N°;Tipo;Cod Operacion;Numero de Formato;Fecha;DNI;Apellidos y Nombres\n";

      records.forEach((r, idx) => {
        csvContent += `"${idx + 1}";"${r.d100}";"${r.tipo}";"${r.codOperacion}";"${r.numFormato}";"${r.fecha}";"${r.dni}";"${r.nombres}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `${fileName.replace('.pdf', '')}_Registros.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
